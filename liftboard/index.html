<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outlift</title>
<meta name="description" content="Pick a gym split, log your lifts and battle your mates on a pound-for-pound leaderboard.">
<meta name="theme-color" content="#f7f6f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outlift">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="ex/map.js"></script>
<script src="ex/videos.js"></script>
<script src="exercises.js"></script>
<style>
:root{
  --bg:#f7f6f2; --bg2:#f1efea; --card:#ffffff; --card2:#f5f3ee; --line:#e8e5de;
  --text:#2c2c31; --muted:#76767f; --dim:#a4a4ac;
  --lime:#3fae6a; --lime2:#349459; --on-accent:#ffffff;
  --orange:#f08a4b; --red:#e2566b; --blue:#4b8df0; --gold:#d99a1e; --purple:#9a6cf0; --pink:#e8659f; --teal:#22a99b;
  --t-green:#eaf6ee; --t-red:#fdeef0; --t-gold:#fdf4e1; --t-blue:#ebf2fe; --t-purple:#f3eefe; --t-pink:#fdeef5; --t-teal:#e5f6f3; --t-orange:#fef1e8;
  --shadow:0 1px 2px rgba(40,36,30,.04),0 6px 20px -8px rgba(40,36,30,.10);
  --r:22px; --nav:78px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
body.noauth{padding-bottom:0}
a{color:inherit;text-decoration:none}
input,textarea,select,button{font:inherit;color:inherit}
b,strong{font-weight:600}
.hidden{display:none!important}
h1,h2,.display{font-family:Inter,system-ui,sans-serif;letter-spacing:-.02em;font-weight:600}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px;line-height:1.25;margin-bottom:8px}
h3{font-size:16.5px;font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)} .lime{color:var(--lime)} .red{color:var(--red)} .gold{color:var(--gold)} .orange{color:var(--orange)} .blue{color:var(--blue)} .purple{color:var(--purple)}
.small{font-size:14px} .tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:12px} .col{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.center{text-align:center}
.mt{margin-top:16px} .mt2{margin-top:30px} .mb{margin-bottom:18px}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;background:rgba(247,246,242,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1}
.logo b{font-weight:700;background:linear-gradient(90deg,var(--lime),var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{position:relative;width:44px;height:44px;border-radius:15px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:19px;cursor:pointer;transition:transform .15s;box-shadow:var(--shadow)}
#chatBtn{background:var(--t-pink);border-color:#f6d5e5} #bellBtn{background:var(--t-gold);border-color:#f3e2b8}
.iconbtn:active{transform:scale(.9)}
.dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.ring{animation:ring .9s ease}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}

main{max-width:680px;margin:0 auto;padding:24px 20px}
.view-in{animation:viewIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* bottom nav: each tab has its own colour */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.bottom a{--c:var(--lime);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500;position:relative;transition:color .2s}
nav.bottom a[data-nav=home]{--c:var(--blue)} nav.bottom a[data-nav=train]{--c:var(--orange)} nav.bottom a[data-nav=leaderboard]{--c:var(--gold)}
nav.bottom a[data-nav=social]{--c:var(--pink)} nav.bottom a[data-nav=profile]{--c:var(--purple)}
nav.bottom a .ic{font-size:22px;width:46px;height:32px;border-radius:12px;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
nav.bottom a.on{color:var(--c);font-weight:600}
nav.bottom a.on .ic{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 14%,transparent)}
nav.bottom .dot{top:6px;right:calc(50% - 24px)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;position:relative;box-shadow:var(--shadow)}
.card.hl{background:var(--t-green);border-color:#cfe9d8}
.card.warn{background:var(--t-red);border-color:#f6d3d9}
.card.gold{background:var(--t-gold);border-color:#f3e2b8}
.card.blue{background:var(--t-blue);border-color:#d3e2fb}
.card.purple{background:var(--t-purple);border-color:#e1d6fb}
.card.pink{background:var(--t-pink);border-color:#f6d5e5}
.card.teal{background:var(--t-teal);border-color:#c9ebe5}
.card.orange{background:var(--t-orange);border-color:#f8dcc8}
.card.gold,.card.blue,.card.purple,.card.orange,.card.red{color:var(--text)}
.card.click{cursor:pointer;transition:transform .15s,border-color .2s}
.card.click:active{transform:scale(.985)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill.lime{color:var(--on-accent);background:var(--lime);border-color:var(--lime)}
.pill.red{color:#fff;background:var(--red);border-color:var(--red)}
.pill.gold{color:#fff;background:var(--gold);border-color:var(--gold)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:38px 2px 12px}
.sec-title h2{margin:0;display:flex;align-items:center;gap:10px}
.sec-title h2::before{content:'';width:6px;height:22px;border-radius:6px;background:linear-gradient(180deg,var(--lime),var(--blue),var(--purple),var(--pink))}
.help{font-size:14px;color:var(--muted);margin:0 2px 18px}

/* buttons */
.bwrap{display:flex;flex-direction:column;gap:7px;min-width:0}
.bwrap.inline{display:inline-flex}
.tip{font-size:12.5px;color:var(--dim);line-height:1.45;padding:0 2px}
body.notips .tip{display:none}
.btn{position:relative;overflow:hidden;border:none;cursor:pointer;border-radius:15px;padding:14px 20px;font-weight:600;font-size:15px;background:var(--card);color:var(--text);border:1px solid var(--line);transition:transform .12s,filter .2s,background .2s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:var(--lime);color:var(--on-accent);border-color:var(--lime);box-shadow:0 8px 22px -10px rgba(63,174,106,.7)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:transparent;color:var(--red);border-color:#f3c7cf}
.btn.ghost{background:transparent;border-color:transparent}
.btn.big{padding:18px 22px;font-size:16.5px;border-radius:18px;width:100%}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:12px}
.btn.full{width:100%}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(0,0,0,.08);animation:rip .6s linear;pointer-events:none}
.btn.primary .ripple{background:rgba(255,255,255,.35)}
@keyframes rip{to{transform:scale(4);opacity:0}}
.btn.pop{animation:popb .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes popb{40%{transform:scale(1.12)}}

/* forms */
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 8px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(75,141,240,.14)}
textarea.inp{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:15px;padding:5px;gap:5px}
.seg button{flex:1;border:none;background:none;padding:10px 6px;border-radius:11px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.avatars{display:flex;flex-wrap:wrap;gap:10px}
.avatars button{width:48px;height:48px;font-size:24px;border-radius:14px;background:var(--card);border:2px solid var(--line);cursor:pointer;transition:transform .15s}
.avatars button.on{border-color:var(--lime);transform:scale(1.08);background:var(--t-green)}

/* avatar */
.av{width:44px;height:44px;border-radius:15px;background:var(--t-blue);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.av.lg{width:92px;height:92px;font-size:48px;border-radius:30px;background:linear-gradient(135deg,var(--t-green),var(--t-blue),var(--t-purple))}
.av.sm{width:34px;height:34px;font-size:17px;border-radius:11px}

/* stats: every tile its own colour */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.stats .stat:nth-child(4n+1){background:var(--t-blue);border-color:#d3e2fb}
.stats .stat:nth-child(4n+2){background:var(--t-orange);border-color:#f8dcc8}
.stats .stat:nth-child(4n+3){background:var(--t-pink);border-color:#f6d5e5}
.stats .stat:nth-child(4n+4){background:var(--t-purple);border-color:#e1d6fb}
.stat .v{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat .l{font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
@media(max-width:400px){.stats{gap:8px}.stat .v{font-size:20px}}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:14px 0 24px}
.pod{text-align:center;cursor:pointer}
.pod .av{margin:0 auto 8px;width:56px;height:56px;font-size:30px;border-radius:19px}
.pod.p1 .av{width:68px;height:68px;font-size:38px;background:var(--t-gold);border-color:var(--gold);box-shadow:0 0 0 5px rgba(217,154,30,.15)}
.pod.p2 .av{background:var(--t-blue)} .pod.p3 .av{background:var(--t-orange)}
.pod .name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .gain{font-size:18px;font-weight:600;color:var(--lime)}
.pod .gain.neg{color:var(--red)}
.pod .block{border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-size:28px;font-weight:600;color:#fff;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,1.3,.4,1) both}
.pod.p1 .block{height:118px;background:linear-gradient(180deg,#f2c14e,var(--gold));animation-delay:.25s}
.pod.p2 .block{height:88px;background:linear-gradient(180deg,#8fb6f6,var(--blue));animation-delay:.1s}
.pod.p3 .block{height:66px;background:linear-gradient(180deg,#f6b285,var(--orange));animation-delay:.4s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;animation:viewIn .4s both;box-shadow:var(--shadow)}
.lrow.me{border-color:#bfe3cc;background:var(--t-green)}
.lrow .rk{width:26px;text-align:center;font-size:18px;font-weight:600;color:var(--dim)}
.lrow .g{font-size:18px;font-weight:600;text-align:right;min-width:68px}
.fame{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fame .card{margin:0;padding:16px}
.fame .ttl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fame .who{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600}
.fame .val{font-size:18px;font-weight:600;margin-top:4px}

/* feed */
.wk-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.wk-ex:last-child{border:none}
.rx{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rx button{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;transition:transform .15s}
.rx button.on{border-color:var(--pink);background:var(--t-pink)}
.rx button:active{transform:scale(1.25)}
.rx button.pop{animation:popb .4s cubic-bezier(.3,1.8,.5,1)}

/* logger */
.ex-card .sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:10px}
.sets th{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;text-align:left;padding:4px}
.sets td{padding:0 4px}
.sets .num{width:30px;text-align:center;font-weight:600;color:var(--muted)}
.sets input{width:100%;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 4px;font-weight:600;font-size:16px;outline:none}
.sets input:focus{border-color:var(--blue);background:var(--card)}
.sets tr.done input{background:var(--t-green);border-color:#bfe3cc}
.tick{width:48px;height:44px;border-radius:13px;border:2px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;transition:all .2s cubic-bezier(.3,1.6,.5,1);color:transparent}
.tick.on{background:var(--lime);border-color:var(--lime);color:#fff;transform:scale(1.05)}
.xbtn{border:none;background:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px 8px}
.ex-card:nth-of-type(5n+1){border-left:4px solid var(--blue)} .ex-card:nth-of-type(5n+2){border-left:4px solid var(--orange)}
.ex-card:nth-of-type(5n+3){border-left:4px solid var(--purple)} .ex-card:nth-of-type(5n+4){border-left:4px solid var(--teal)} .ex-card:nth-of-type(5n+5){border-left:4px solid var(--pink)}
.resttimer{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);z-index:45;background:var(--text);color:#fff;font-weight:600;border-radius:99px;padding:11px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);animation:restIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes restIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.resttimer button{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:5px 11px;font-weight:600;cursor:pointer}

/* toasts */
#toasts{position:fixed;top:calc(72px + env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:18px;padding:14px 16px;box-shadow:0 18px 40px -12px rgba(40,36,30,.3);display:flex;gap:12px;align-items:flex-start;animation:tin .45s cubic-bezier(.2,1.4,.4,1);cursor:pointer}
.toast.out{animation:tout .3s forwards}
.toast.pr,.toast.goal,.toast.badge{border-left-color:var(--lime)} .toast.loss,.toast.last{border-left-color:var(--red)} .toast.leader,.toast.weekly{border-left-color:var(--gold)}
.toast.message,.toast.comment{border-left-color:var(--pink)} .toast.nudge,.toast.reaction{border-left-color:var(--orange)} .toast.recap{border-left-color:var(--purple)}
@keyframes tin{from{opacity:0;transform:translateY(-30px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-20px)}}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(44,44,49,.35);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,1,.3,1)}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:28px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(60px);opacity:0}}
.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* badges: unlocked ones get a pastel colour each */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;cursor:pointer}
.bdg:not(.locked):nth-child(6n+1){background:var(--t-gold)} .bdg:not(.locked):nth-child(6n+2){background:var(--t-blue)} .bdg:not(.locked):nth-child(6n+3){background:var(--t-pink)}
.bdg:not(.locked):nth-child(6n+4){background:var(--t-green)} .bdg:not(.locked):nth-child(6n+5){background:var(--t-purple)} .bdg:not(.locked):nth-child(6n+6){background:var(--t-orange)}
.bdg .e{font-size:28px;display:block;transition:transform .2s}
.bdg .n{font-size:11px;font-weight:500;margin-top:5px;line-height:1.25}
.bdg.locked{background:var(--bg2)} .bdg.locked .e{filter:grayscale(1) opacity(.3)} .bdg.locked .n{color:var(--dim)}
.bdg.new .e{animation:badgepop 1s cubic-bezier(.3,1.8,.5,1)}
@keyframes badgepop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
.bigbadge{font-size:64px;display:inline-block;animation:badgepop 1s cubic-bezier(.3,1.8,.5,1) both}

/* chat */
.bubbles{display:flex;flex-direction:column;gap:8px;padding-bottom:90px}
.bub{max-width:78%;padding:10px 15px;border-radius:20px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;animation:viewIn .25s}
.bub.mine{align-self:flex-end;background:var(--blue);border-color:var(--blue);color:#fff}
.bub .t{font-size:10.5px;opacity:.6;margin-top:2px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:35;padding:12px 14px;background:rgba(247,246,242,.95);border-top:1px solid var(--line)}
.composer .in{max-width:680px;margin:0 auto;display:flex;gap:10px}

.progress{height:10px;border-radius:10px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:10px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.notif{display:flex;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;cursor:pointer;animation:viewIn .3s both}
.notif.unread{border-color:#d3e2fb;background:var(--t-blue)}

async function refreshCounts() {

  const [{ count: n }, { count: m }] = await Promise.all([
    sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', S.me.id).eq('read', false),

function paintCounts() {
  const set = (id, n) => { const d = $(id); if (!d) return; d.textContent = n > 99 ? '99+' : n; d.classList.toggle('hidden', !n); };
  set('#bellDot', S.unread); set('#msgDot', S.unreadMsgs); set('#navMsgDot', S.unreadMsgs);
  document.title = (S.unread ? `(${S.unread}) ` : '') + 'Outlift';
  try { S.unread ? navigator.setAppBadge?.(S.unread) : navigator.clearAppBadge?.(); } catch {}
}
function onNotification(n) {
  S.unread++; paintCounts();
  const bell = $('#bellBtn'); bell?.classList.remove('ring'); void bell?.offsetWidth; bell?.classList.add('ring');
  const onThisChat = n.kind === 'message' && location.hash === n.link;
  if (!onThisChat) {
    toast(n.title, n.body, n.kind, n.link);
    sound(n.kind);
    buzz(n.kind === 'loss' || n.kind === 'last' ? [200, 80, 200] : [60, 40, 60]);
  }
  if (n.kind === 'pr' || n.kind === 'leader') { if (!document.hidden) window.confetti?.({ particleCount: 50, spread: 60, origin: { y: .1 }, zIndex: 200 }); }
  // If the tab is in the background and push isn't set up, show a system notification from the page.
  if (document.hidden && !S.pushOn && window.Notification?.permission === 'granted' && S.swReg) {
    S.swReg.showNotification(n.title, { body: n.body, icon: 'icon-192.png', tag: 'n' + n.id, data: { link: n.link } });

  if (location.hash === '#/notifications') render();
}
function subscribeRealtime() {
  if (S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel('me-' + S.me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${S.me.id}` }, p => onNotification(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `recipient_id=eq.${S.me.id}` }, p => onMessage(p.new))
    .subscribe();
}
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    S.swReg = await navigator.serviceWorker.register('sw.js');
    const sub = await S.swReg.pushManager?.getSubscription();
    S.pushOn = !!sub && window.Notification?.permission === 'granted';
    navigator.serviceWorker.addEventListener('message', e => { if (e.data?.link) location.hash = safeLink(e.data.link); });
  } catch (e) { console.warn('SW failed', e); }
}
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function b64ToU8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function enablePush() {
  if (isIOS() && !isStandalone()) {
    modal(`<h2>📲 One quick step on iPhone</h2>
      <p class="muted">Apple only allows notifications for apps on your Home Screen.</p>
      <ol class="mt" style="padding-left:20px;line-height:1.9">
        <li>Tap the <b>Share</b> button <span class="pill">⬆️</span> in Safari</li>
        <li>Tap <b>Add to Home Screen</b></li>
        <li>Open Outlift from your Home Screen</li>
        <li>Come back here and tap <b>Turn on notifications</b></li>
      </ol>
      <button class="btn primary full mt" onclick="closeModal()">Got it</button>`);
    return;
  }
  if (!('Notification' in window) || !('serviceWorker' in navigator)) { toast('This browser can’t do notifications', 'Try Chrome, Edge, Firefox or Safari (iOS 16.4+).', 'loss'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications blocked', 'Allow them in your browser/site settings, then try again.', 'loss'); return; }
  try {
    const reg = S.swReg || await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await q(sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, user_id: S.me.id, p256dh: j.keys.p256dh, auth: j.keys.auth }));
    S.pushOn = true;
    toast('Notifications ON 🔔', 'You’ll get pinged even when the app is closed.', 'pr');
    boom(.5);
    await sb.rpc('test_push');
    render();
  } catch (e) { toast('Couldn’t turn on push', e.message, 'loss'); }
}
async function disablePush() {
  try {
    const sub = await S.swReg?.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  } catch {}
  S.pushOn = false;
}

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  if (!(location.hash || '').startsWith('#/x/')) closeExercise();
  const app = $('#app');
  if (!S.session) { document.body.className = 'noauth' + (prefs.tips ? '' : ' notips'); $('#top').classList.add('hidden'); $('#nav').classList.add('hidden'); app.innerHTML = viewAuth(); return; }
  document.body.className = prefs.tips ? '' : 'notips';
  $('#top').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  const hash = location.hash || '#/';
  let match = null, view = viewHome, tab = 'home';
  for (const [re, fn, t] of routes) { const m = hash.match(re); if (m) { match = m; view = fn; tab = t; break; } }
  $$('nav.bottom a').forEach(a => a.classList.toggle('on', a.dataset.nav === tab));
  if (!app.innerHTML.trim() || app.dataset.hash !== hash) app.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    const html = await view(...(match ? match.slice(1) : []));
    if (seq !== renderSeq) return;
    const same = app.dataset.hash === hash;
    app.dataset.hash = hash;
    app.innerHTML = html;
    if (!same) { app.classList.remove('view-in'); void app.offsetWidth; app.classList.add('view-in'); window.scrollTo(0, 0); }
    after.forEach(f => f()); after = [];
    if (S.scrollTo) { document.getElementById(S.scrollTo)?.scrollIntoView({ behavior: 'smooth' }); S.scrollTo = null; }
    if (S.pendingEx && !hash.startsWith('#/x/')) { const p = S.pendingEx; S.pendingEx = null; openExercise(p.name, p.opts); }
  } catch (e) {
    if (seq !== renderSeq) return;
    app.innerHTML = `<div class="empty"><span class="e">😵</span>Something went wrong.<div class="small mt">${esc(e.message)}</div>
      <div class="mt">${btn('Try again', 'reload', 'Reloads this screen.', 'primary')}</div></div>`;
  }
}

  const i = split.days.findIndex(d => d.name === last.day_name);
  return (i + 1) % split.days.length;

/* rest timer */
let restT = null;
function startRest(sec) {
  // Build the pill once and only update its text, so it doesn't re-animate (flicker) every tick.
  if (!restT) {
    $('#restSlot').innerHTML = `<div class="resttimer">⏳ Rest <span id="restLeft" style="font-variant-numeric:tabular-nums"></span><button data-act="restAdd">+15s</button><button data-act="restSkip">Skip</button></div>`;
    restT = { end: 0, iv: setInterval(paintRest, 250) };
  }
  restT.end = Date.now() + sec * 1000;
  paintRest();
}
function paintRest() {
  if (!restT) return;
  const left = Math.max(0, Math.ceil((restT.end - Date.now()) / 1000));
  const el = $('#restLeft');
  const txt = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (el && el.textContent !== txt) el.textContent = txt;
  if (left <= 0) {
    stopRest(); sound('rest'); buzz([200, 100, 200, 100, 400]); toast('Rest over — next set! 💪', '', 'pr', null, 2500);
    if (document.hidden && window.Notification?.permission === 'granted' && S.swReg) S.swReg.showNotification('Rest over — next set! 💪', { icon: 'icon-192.png', tag: 'rest' });
  }
}
function stopRest() { if (restT) clearInterval(restT.iv); restT = null; $('#restSlot').innerHTML = ''; }
A.restSkip = () => stopRest();
A.restAdd = () => { if (restT) { restT.end += 15000; paintRest(); } };

function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  ks.slice(0, -1).forEach(k => o = o[k]);

  o[last] = last === 'sets' ? (parseInt(val) || '') : val;
}

function fame(rows) {
  if (!rows.length) return '';
  const by = (f, filt = () => true) => rows.filter(filt).slice().sort((a, b) => (f(b) ?? -1e9) - (f(a) ?? -1e9))[0];

  const cons = by(r => r.consistency_pts, r => r.consistency_pts > 0);
  const drops = by(r => r.drops, r => r.drops > 0);
  const ghost = rows.slice().sort((a, b) => new Date(a.last_workout || 0) - new Date(b.last_workout || 0))[0];
  return `<div class="fame">

    ${cons ? card('📆 Most consistent', cons, cons.consistency_pts / 25 + (cons.consistency_pts === 25 ? ' strong week' : ' strong weeks'), 'purple') : ''}

    ${card('🛋️ Most days off', missed, (missed?.missed_days || 0) + ' missed · −' + (missed?.missed_pts || 0), 'warn')}
    ${card('👻 Ghost', ghost, ghost?.last_workout ? daysSince(ghost.last_workout) + ' days since last' : 'never trained', 'gold')}
  </div>`;
}

function bestSets(lifts) {

  });
  return Object.values(m);
}

function drawChart(lifts, ex) {
  const svg = $('#chart'); if (!svg) return;
  const byDay = {};
  lifts.filter(l => l.exercise.trim().toLowerCase() === ex.toLowerCase()).forEach(l => {
    const d = l.created_at.slice(0, 10); byDay[d] = Math.max(byDay[d] || 0, +l.e1rm);
  });
  const pts = Object.entries(byDay).sort();
  const W = svg.clientWidth || 320, H = 170, P = 26;
  if (pts.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" fill="#76767f" text-anchor="middle" font-size="13">Log ${esc(ex)} again to see a trend</text>`; return; }
  const vals = pts.map(p => p[1]), mn = Math.min(...vals) * .95, mx = Math.max(...vals) * 1.05;
  const x = i => P + i * (W - P * 2) / (pts.length - 1), y = v => H - P - (v - mn) / (mx - mn || 1) * (H - P * 2);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4b8df0" stop-opacity=".25"/><stop offset="1" stop-color="#4b8df0" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L${x(pts.length - 1)},${H - P} L${x(0)},${H - P}Z" fill="url(#cg)"/>
    <path d="${path}" fill="none" stroke="#4b8df0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.4s ease forwards"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="4.5" fill="#ffffff" stroke="#4b8df0" stroke-width="2"/>`).join('')}
    <text x="${P}" y="14" fill="#76767f" font-size="11">${Math.round(vals[0])}kg</text><text x="${W - P}" y="14" fill="#3fae6a" font-size="12" text-anchor="end" font-weight="600">${Math.round(vals[vals.length - 1])}kg</text>
    <style>@keyframes draw{to{stroke-dashoffset:0}}</style>`;

const ACTS = {

function cardioSummary(acts) {
  if (!acts.length) return '<p class="small muted">No cardio or recovery logged yet.</p>';
  const by = {};
  acts.forEach(a => { const t = by[a.kind] = by[a.kind] || { n: 0, min: 0, km: 0, best: 0 }; t.n++; t.min += a.duration_min; t.km += +a.distance_km || 0; t.best = Math.max(t.best, +a.distance_km || 0); });
  return `<div class="card">${Object.entries(by).map(([k, t]) => `<div class="wk-ex"><span>${(ACTS[k] || ACTS.other)[0]} ${(ACTS[k] || ACTS.other)[1]} <span class="tiny muted">×${t.n}</span></span>

  await ensureMyLifts();
  if (!S.active) S.active = { split_id: null, day_name: 'Quick workout', started: Date.now(), notes: '', exercises: [] };
  if (!S.active.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) S.active.exercises.push(mkExercise(name, 3, ''));
  saveActive(); closeExercise(); toast(name + ' added 💪', 'Log your sets below.', 'pr'); location.hash = '#/log';
};
async function viewScan(name) {
  S.pendingEx = { name: decodeURIComponent(name), opts: { fromQR: true } };
  location.replace('#/' + (S.active ? 'log' : ''));
  return '<div class="skel"></div>';
}

/* ================== QR CODES ================== */
let qrPicked = new Set();
async function viewQR() {
  return `<a href="#/train" class="back">← Train</a><h1 class="mt">QR codes for machines</h1>
    <p class="help mt">Pick exercises, print the codes and stick them on the machines. Anyone who scans one with their phone camera sees how to do it and can add it straight to their workout.</p>
    <div class="row mb"><input class="inp" id="qrCustom" list="exList" placeholder="Add any exercise…"><button class="btn" data-act="qrAddCustom">Add</button></div>
    <datalist id="exList">${EXERCISES.map(e => `<option value="${e}">`).join('')}</datalist>
    <div class="card"><div class="qr-pick">${[...new Set([...EXERCISES, ...qrPicked])].map(e => `<label class="qr-opt"><input type="checkbox" data-qr="${esc(e)}" ${qrPicked.has(e) ? 'checked' : ''}> ${esc(e)}</label>`).join('')}</div></div>
    ${btn('🖨️ Make printable QR codes', 'makeQR', 'Opens a print-ready sheet. Print it or save it as a PDF.', 'primary big')}
    <div id="qrSheet" class="mt2"></div>`;
}
document.addEventListener('change', e => { const n = e.target.dataset?.qr; if (n) e.target.checked ? qrPicked.add(n) : qrPicked.delete(n); });
A.qrAddCustom = () => { const n = $('#qrCustom').value.trim(); if (!n) return; qrPicked.add(n); render(); };
function qrSvg(text) {
  if (!window.qrcode) return '<div class="small red">QR library didn’t load. Check your connection.</div>';
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
A.makeQR = () => {
  if (!qrPicked.size) return toast('Tick at least one exercise', '', 'loss');
  const base = location.origin + location.pathname + '#/x/';
  $('#qrSheet').innerHTML = `<div class="row between mb"><h2>Your QR codes</h2><button class="btn primary" onclick="window.print()">🖨️ Print</button></div>
    <div class="qr-grid" id="printArea">${[...qrPicked].map(n => `<div class="qr-card">${qrSvg(base + encodeURIComponent(n))}<b>${esc(n)}</b><span>Scan with your camera · Outlift</span></div>`).join('')}</div>`;
  $('#qrSheet').scrollIntoView({ behavior: 'smooth' });
};

/* ================== AI CHAT COACH ================== */
const chatLog = () => { try { return JSON.parse(sessionStorage.getItem('lb_coach') || '[]'); } catch { return []; } };
const saveChat = c => { try { sessionStorage.setItem('lb_coach', JSON.stringify(c.slice(-30))); } catch {} };
const SUGGEST = ['What should I train today?', 'Why is my bench stuck?', 'Make me a 4-day plan', 'How do I fix my squat form?', 'How many sets should I do?'];
async function viewCoach() {
  const c = chatLog();
  after.push(() => { window.scrollTo(0, document.body.scrollHeight); });
  return `<div class="row between"><h1>🤖 Coach</h1>${c.length ? '<button class="btn sm" data-act="clearCoach">New chat</button>' : ''}</div>
    <p class="help mt">Ask anything about training. The coach can see your split, recent workouts and goals, so answers are about <b>you</b>.</p>
    <div class="bubbles" id="coachBubbles">${c.map(m => `<div class="bub ${m.role === 'user' ? 'mine' : 'coach'}">${esc(m.content)}</div>`).join('') || `<div class="card purple"><b>Try asking:</b><div class="col mt">${SUGGEST.map(s => `<button class="btn sm" data-act="askCoach" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`}</div>
    <form class="composer" onsubmit="return false"><div class="in"><input class="inp" id="coachIn" placeholder="Ask the coach…" maxlength="1000" autocomplete="off"><button class="btn primary" data-act="askCoach" type="submit">Send</button></div></form>`;
}
A.clearCoach = () => { saveChat([]); render(); };
A.askCoach = async el => {
  const text = (el.dataset.q || $('#coachIn')?.value || '').trim(); if (!text) return;
  if ($('#coachIn')) $('#coachIn').value = '';
  const c = chatLog(); c.push({ role: 'user', content: text }); saveChat(c);
  await render();
  $('#coachBubbles').insertAdjacentHTML('beforeend', '<div class="bub coach typing" id="typing"><span></span><span></span><span></span></div>');
  window.scrollTo(0, document.body.scrollHeight);
  const { data, error } = await sb.functions.invoke('ai-chat', { body: { messages: c } });
  let reply;
  if (error) { reply = null; let msg = error.message; try { msg = (await error.context.json()).error || msg; } catch {} toast('Coach unavailable', msg, 'loss'); }
  else reply = data.reply;
  if (reply) { c.push({ role: 'assistant', content: reply }); saveChat(c); sound('message'); }
  if (location.hash === '#/coach') render();
};

/* ================== SETTINGS ================== */
async function viewSettings() {
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  return `<a href="#/profile" class="small muted">← Profile</a><h1 class="mt">Settings</h1>
    <div class="card"><h3>🔔 Notifications</h3>
      <p class="small muted mt">Status: <b class="${S.pushOn ? 'lime' : 'red'}">${S.pushOn ? 'Push ON' : perm === 'denied' ? 'Blocked in browser settings' : 'Off'}</b></p>
      <p class="tiny muted mt">You’ll be told when: someone PRs, takes #1, goes backwards, is dead last, smashes a goal, hasn’t trained in a week, messages, comments, reacts or nudges you — plus weekly results every Monday.</p>
      <div class="row mt" style="align-items:flex-start">${S.pushOn ? btn('Send test', 'testPush', 'Sends a test notification to this device.', 'sm grow') + btn('Turn off', 'pushOff', 'Stops push on this device.', 'sm danger grow')
        : btn('Turn on notifications', 'enablePush', 'Allow alerts even when the app is closed.', 'primary grow')}</div></div>
    <div class="card"><h3>🔒 Privacy</h3>
      ${toggleRowFn('Public profile', S.me.is_public, 'togglePublic', S.me.is_public ? 'Everyone on Outlift can see your workouts and you’re on the public leaderboard.' : 'Only people in your groups can see your workouts.')}
      <label class="f">Your area (for the local leaderboard)</label>
      <div class="row"><input class="inp" id="myRegion" value="${esc(S.me.region || '')}" placeholder="e.g. South Morang" maxlength="60"><button class="btn" data-act="saveRegion">Save</button></div>
      <div class="tip mt">Public lifters with the same area appear on your 📍 Local board.</div></div>
    <div class="card"><h3>📲 Install the app</h3><p class="small muted mt">${isIOS() ? 'In Safari tap Share ⬆️ → Add to Home Screen. Needed for notifications on iPhone.' : 'In Chrome tap ⋮ → Install app / Add to Home screen. It’ll open full-screen like a real app.'}</p></div>
    <div class="card"><h3>Preferences</h3>
      ${toggleRow('Show button tips', 'tips', 'The little grey explanations under buttons.')}
      ${toggleRow('Sounds', 'sound', 'Fanfare for PRs, sad trombone for losses.')}
      <label class="f">Rest timer after each set</label>
      <div class="seg">${[60, 90, 120, 180].map(s => `<button class="${prefs.rest === s ? 'on' : ''}" data-act="setRest" data-s="${s}">${s < 120 ? s + 's' : s / 60 + 'm'}</button>`).join('')}</div>
      <div class="tip mt">Starts automatically when you tick a set.</div></div>
    <div class="card"><h3>Account</h3><p class="small muted mt">Logged in as <b>${esc(S.me.username)}</b>.${S.isAdmin ? ' You’re the <b>app owner</b>.' : ''}</p>
      <label class="f">Change my password</label>
      <input class="inp" id="myPw" type="password" autocomplete="new-password" placeholder="New password (6+ characters)">
      <div class="mt">${btn('Save new password', 'changePw', 'Use it next time you log in on any device.', 'full')}</div>
      <div class="mt">${btn('Log out', 'logout', 'Signs you out on this device.', 'danger full')}</div></div>
    ${S.isAdmin ? `<div class="card purple"><h3>🔑 Reset someone’s password</h3>
      <p class="small muted mt">Only you see this. If a friend forgets their password, set a new one here and tell them what it is. They get a notification and can change it in Settings.</p>
      <label class="f">Their username</label>
      <input class="inp" id="rsUser" list="userList" autocapitalize="off" placeholder="e.g. eve_tawadros">
      <datalist id="userList">${Object.values(S.profiles).map(p => `<option value="${esc(p.username)}">`).join('')}</datalist>
      <label class="f">New password for them</label>
      <input class="inp" id="rsPw" autocomplete="off" placeholder="6+ characters">
      <div class="mt">${btn('Reset their password', 'adminReset', 'Their old password stops working straight away.', 'primary full')}</div></div>` : ''}`;
}
function toggleRowFn(label, on, act, tip) {
  return `<div class="row between mt"><div class="grow"><b class="small">${label}</b><div class="tip">${tip}</div></div><button class="btn sm ${on ? 'primary' : ''}" data-act="${act}">${on ? 'ON' : 'OFF'}</button></div>`;
}
A.togglePublic = async () => {
  const v = !S.me.is_public;
  if (!v && !await confirmBox('Go private?', 'Only people in your groups will see your workouts, and you’ll leave the public leaderboard.', 'Go private')) return;
  await q(sb.from('profiles').update({ is_public: v }).eq('id', S.me.id));
  S.me.is_public = v; toast(v ? 'Profile is public 🌍' : 'Profile is private 🔒', '', 'pr'); render();
};
A.saveRegion = async () => {
  const region = $('#myRegion').value.trim() || null;
  await q(sb.from('profiles').update({ region }).eq('id', S.me.id));
  S.me.region = region; toast('Area saved 📍', region || 'Cleared', 'pr');
};
function toggleRow(label, key, tip) {
  return `<div class="row between mt"><div><b class="small">${label}</b><div class="tip">${tip}</div></div><button class="btn sm ${prefs[key] ? 'primary' : ''}" data-act="togglePref" data-k="${key}">${prefs[key] ? 'ON' : 'OFF'}</button></div>`;
}
A.togglePref = el => { prefs[el.dataset.k] = !prefs[el.dataset.k]; lsSet('lb_prefs', prefs); render(); };
A.setRest = el => { prefs.rest = +el.dataset.s; lsSet('lb_prefs', prefs); render(); };
A.pushOff = async () => { await disablePush(); toast('Push turned off'); render(); };

/* ================== BOOT ================== */
async function boot(session) {
  S.session = session;
  if (!session) { S.me = null; if (S.channel) { sb.removeChannel(S.channel); S.channel = null; } render(); return; }
  try {
    await Promise.all([loadProfiles(), loadSplits(), loadGyms()]);
    if (!S.me) { await new Promise(r => setTimeout(r, 800)); await loadProfiles(); }
    if (!S.me) throw new Error('Profile not found');
    subscribeRealtime();
    sb.from('admins').select('user_id').eq('user_id', S.me.id).maybeSingle().then(({ data }) => { S.isAdmin = !!data; });
    registerSW().then(() => { if (location.hash === '#/' || !location.hash) render(); });
    refreshCounts();
    sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', S.me.id).then(() => {});
  } catch (e) { toast('Couldn’t load your account', e.message, 'loss'); }
  render();
}
let booted = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
    if (event === 'SIGNED_IN' && booted && S.session?.user.id === session?.user.id) return;
    booted = true; setTimeout(() => boot(session), 0);
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refreshCounts(); });
</script>
