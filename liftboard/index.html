<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftBoard</title>
<meta name="description" content="Pick a gym split, log your lifts and battle your mates on a pound-for-pound leaderboard.">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftBoard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<style>
:root{
  --bg:#0b0d10; --bg2:#12151a; --card:#161a20; --card2:#1d222a; --line:#262c35;
  --text:#f2f4f7; --muted:#8b95a3; --dim:#5d6672;
  --lime:#c6ff3d; --lime2:#a8e01f; --orange:#ff7a2f; --red:#ff4d5e; --blue:#4da3ff; --gold:#ffcf3d; --purple:#b17dff;
  --r:18px; --nav:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px)}
body.noauth{padding-bottom:0}
a{color:inherit;text-decoration:none}
input,textarea,select,button{font:inherit;color:inherit}
.hidden{display:none!important}
h1,h2,.display{font-family:'Bebas Neue',Inter,sans-serif;letter-spacing:.5px;font-weight:400}
h1{font-size:34px;line-height:1}
h2{font-size:26px;line-height:1.05;margin-bottom:6px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)} .dim{color:var(--dim)} .lime{color:var(--lime)} .red{color:var(--red)} .gold{color:var(--gold)} .orange{color:var(--orange)}
.small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.center{text-align:center}
.mt{margin-top:14px} .mt2{margin-top:24px} .mb{margin-bottom:14px}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,13,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:'Bebas Neue';font-size:28px;letter-spacing:1px;line-height:1}
.logo b{color:var(--lime);font-weight:400}
.iconbtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:19px;cursor:pointer;transition:transform .15s}
.iconbtn:active{transform:scale(.9)}
.dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.ring{animation:ring .9s ease}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}

main{max-width:640px;margin:0 auto;padding:16px}
.view-in{animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(14,16,20,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;position:relative;transition:color .2s}
nav.bottom a .ic{font-size:22px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav.bottom a.on{color:var(--lime)} nav.bottom a.on .ic{transform:translateY(-3px) scale(1.15)}
nav.bottom a.on::after{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--lime)}
nav.bottom .dot{top:6px;right:calc(50% - 22px)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative}
.card.hl{background:linear-gradient(135deg,#1f2a10,#161a20 60%);border-color:#3b4d17}
.card.warn{background:linear-gradient(135deg,#2a1414,#161a20 60%);border-color:#4d1f24}
.card.gold{background:linear-gradient(135deg,#2a2410,#161a20 60%);border-color:#4d4317}
.card.click{cursor:pointer;transition:transform .15s,border-color .2s}
.card.click:active{transform:scale(.985)} .card.click:hover{border-color:#36404c}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill.lime{color:var(--bg);background:var(--lime);border-color:var(--lime)}
.pill.red{color:#fff;background:var(--red);border-color:var(--red)}
.pill.gold{color:#1a1400;background:var(--gold);border-color:var(--gold)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{margin:0}
.help{font-size:13px;color:var(--muted);margin:-2px 2px 14px}

/* buttons */
.bwrap{display:flex;flex-direction:column;gap:5px;min-width:0}
.bwrap.inline{display:inline-flex}
.tip{font-size:11.5px;color:var(--dim);line-height:1.35;padding:0 2px}
body.notips .tip{display:none}
.btn{position:relative;overflow:hidden;border:none;cursor:pointer;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--card2);color:var(--text);border:1px solid var(--line);transition:transform .12s,filter .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:var(--lime);color:#0b0d10;border-color:var(--lime);box-shadow:0 6px 24px -8px rgba(198,255,61,.55)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:transparent;color:var(--red);border-color:#4d1f24}
.btn.ghost{background:transparent}
.btn.big{padding:17px 20px;font-size:17px;border-radius:16px;width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.45);animation:rip .6s linear;pointer-events:none}
.btn.primary .ripple{background:rgba(0,0,0,.25)}
@keyframes rip{to{transform:scale(4);opacity:0}}
.btn.pop{animation:popb .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes popb{40%{transform:scale(1.12)}}

/* forms */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,61,.15)}
textarea.inp{min-height:72px;resize:vertical}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{width:46px;height:46px;font-size:24px;border-radius:13px;background:var(--bg2);border:2px solid var(--line);cursor:pointer;transition:transform .15s}
.avatars button.on{border-color:var(--lime);transform:scale(1.08);background:#1f2a10}

/* avatar */
.av{width:42px;height:42px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.av.lg{width:84px;height:84px;font-size:46px;border-radius:26px}
.av.sm{width:32px;height:32px;font-size:17px;border-radius:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat .v{font-family:'Bebas Neue';font-size:28px;line-height:1}
.stat .l{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:8px 0 18px}
.pod{text-align:center;cursor:pointer}
.pod .av{margin:0 auto 6px;width:54px;height:54px;font-size:30px;border-radius:18px}
.pod.p1 .av{width:66px;height:66px;font-size:38px;border-color:var(--gold);box-shadow:0 0 30px -6px var(--gold)}
.pod .name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .gain{font-family:'Bebas Neue';font-size:22px;color:var(--lime)}
.pod .gain.neg{color:var(--red)}
.pod .block{border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);display:grid;place-items:center;font-family:'Bebas Neue';font-size:34px;color:var(--muted);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,1.3,.4,1) both}
.pod.p1 .block{height:118px;color:var(--gold);border-color:#4d4317;animation-delay:.25s}
.pod.p2 .block{height:88px;animation-delay:.1s} .pod.p3 .block{height:66px;animation-delay:.4s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;animation:viewIn .4s both}
.lrow.me{border-color:var(--lime);background:#171f0d}
.lrow .rk{width:26px;text-align:center;font-family:'Bebas Neue';font-size:22px;color:var(--muted)}
.lrow .g{font-family:'Bebas Neue';font-size:24px;text-align:right;min-width:64px}
.fame{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fame .card{margin:0;padding:13px}
.fame .ttl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fame .who{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700}
.fame .val{font-family:'Bebas Neue';font-size:22px;margin-top:2px}

/* feed */
.wk-ex{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.wk-ex:last-child{border:none}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rx button{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:5px 10px;font-size:14px;cursor:pointer;transition:transform .15s}
.rx button.on{border-color:var(--lime);background:#1f2a10}
.rx button:active{transform:scale(1.25)}
.rx button.pop{animation:popb .4s cubic-bezier(.3,1.8,.5,1)}

/* logger */
.ex-card .sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;text-align:left;padding:4px}
.sets td{padding:4px}
.sets .num{width:30px;text-align:center;font-weight:700;color:var(--muted)}
.sets input{width:100%;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-weight:700;font-size:16px;outline:none}
.sets input:focus{border-color:var(--lime)}
.sets tr.done input{background:#1a240c;border-color:#3b4d17}
.tick{width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);font-size:18px;cursor:pointer;transition:all .2s cubic-bezier(.3,1.6,.5,1);color:transparent}
.tick.on{background:var(--lime);border-color:var(--lime);color:#0b0d10;transform:scale(1.05)}
.xbtn{border:none;background:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px 8px}
.resttimer{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);z-index:45;background:var(--lime);color:#0b0d10;font-weight:800;border-radius:99px;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px -6px rgba(198,255,61,.6);animation:viewIn .3s}
.resttimer button{border:none;background:rgba(0,0,0,.15);border-radius:99px;padding:5px 10px;font-weight:800;cursor:pointer}

/* toasts */
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:440px;width:100%;background:#1f252e;border:1px solid #333c48;border-radius:16px;padding:12px 14px;box-shadow:0 18px 40px -10px rgba(0,0,0,.7);display:flex;gap:10px;align-items:flex-start;animation:tin .45s cubic-bezier(.2,1.4,.4,1);cursor:pointer}
.toast.out{animation:tout .3s forwards}
.toast.pr{border-color:var(--lime)} .toast.loss,.toast.last{border-color:var(--red)} .toast.leader{border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-30px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-20px)}}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,1,.3,1)}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:24px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(60px);opacity:0}}
.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;cursor:pointer}
.bdg .e{font-size:28px;display:block;transition:transform .2s}
.bdg .n{font-size:10.5px;font-weight:700;margin-top:4px;line-height:1.2}
.bdg.locked .e{filter:grayscale(1) opacity(.3)} .bdg.locked .n{color:var(--dim)}
.bdg.new .e{animation:badgepop 1s cubic-bezier(.3,1.8,.5,1)}
@keyframes badgepop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
.bigbadge{font-size:64px;display:inline-block;animation:badgepop 1s cubic-bezier(.3,1.8,.5,1) both}

/* chat */
.bubbles{display:flex;flex-direction:column;gap:6px;padding-bottom:80px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card2);align-self:flex-start;word-wrap:break-word;animation:viewIn .25s}
.bub.mine{align-self:flex-end;background:var(--lime);color:#0b0d10}
.bub .t{font-size:10px;opacity:.6;margin-top:2px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:35;padding:10px 12px;background:rgba(11,13,16,.95);border-top:1px solid var(--line)}
.composer .in{max-width:640px;margin:0 auto;display:flex;gap:8px}

.progress{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lime2),var(--lime));border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.notif{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;cursor:pointer;animation:viewIn .3s both}
.notif.unread{border-color:#3b4d17;background:#151b0e}
.notif .ic{font-size:22px;width:28px;text-align:center}
.skel{height:80px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:44px;display:block;margin-bottom:6px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(198,255,61,.5)}50%{box-shadow:0 0 0 10px rgba(198,255,61,0)}}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:30px 20px}
.hero-logo{font-family:'Bebas Neue';font-size:clamp(44px,15vw,64px);line-height:.9;letter-spacing:1px}
.hero-logo b{color:var(--lime);font-weight:400}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 22px}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;font-size:12.5px;color:var(--muted)}
.feat b{display:block;color:var(--text);font-size:13.5px}
svg.chart{width:100%;height:170px;display:block}
.chip-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-list::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--lime);color:#0b0d10;border-color:var(--lime)}
.day{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg2)}
.exrow{display:grid;grid-template-columns:1fr 54px 64px 30px;gap:6px;margin-top:6px}
.exrow .inp{padding:9px 10px}
</style>
</head>
<body class="noauth">
<header class="top hidden" id="top">
  <a href="#/" class="logo">LIFT<b>BOARD</b></a>
  <div class="row">
    <a href="#/social/chats" class="iconbtn" id="chatBtn" title="Messages" aria-label="Messages">💬<span class="dot hidden" id="msgDot"></span></a>
    <a href="#/notifications" class="iconbtn" id="bellBtn" title="Notifications" aria-label="Notifications">🔔<span class="dot hidden" id="bellDot"></span></a>
  </div>
</header>
<main id="app"><div class="skel"></div><div class="skel"></div></main>
<nav class="bottom hidden" id="nav">
  <a href="#/" data-nav="home"><span class="ic">🏠</span>Home</a>
  <a href="#/train" data-nav="train"><span class="ic">🏋️</span>Train</a>
  <a href="#/leaderboard" data-nav="leaderboard"><span class="ic">🏆</span>Board</a>
  <a href="#/social" data-nav="social"><span class="ic">👥</span>Social<span class="dot hidden" id="navMsgDot"></span></a>
  <a href="#/profile" data-nav="profile"><span class="ic">🙋</span>Me</a>
</nav>
<div id="toasts"></div>
<div id="restSlot"></div>

function ago(t) {
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

let audioCtx;
function sound(kind) {
  if (!prefs.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const seqs = { pr: [523, 659, 784, 1047], leader: [392, 523, 659, 784, 1047], loss: [392, 330, 262, 196], last: [330, 262, 196],
      message: [880, 1175], badge: [659, 880, 1319], rest: [880, 880, 1320], default: [740, 988] };
    const notes = seqs[kind] || seqs.default;
    const sad = kind === 'loss' || kind === 'last';
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = sad ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      const t = audioCtx.currentTime + i * (sad ? .22 : .11);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(sad ? .08 : .15, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + (sad ? .3 : .25));
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + .35);
    });
  } catch {}
}
function buzz(p = [60]) { try { navigator.vibrate?.(p); } catch {} }
function countUp(el, to, dec = 0, suffix = '') {
  const start = performance.now(), dur = 900;
  const step = now => {
    const k = Math.min(1, (now - start) / dur), v = to * (1 - Math.pow(1 - k, 3));
    el.textContent = v.toFixed(dec) + suffix;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.getTime(); }
function weekStreak(dates) {
  const weeks = new Set(dates.map(d => weekStart(d + 'T12:00:00')));
  let w = weekStart(new Date()), n = 0;
  if (!weeks.has(w)) w -= 7 * 864e5;
  while (weeks.has(w)) { n++; w -= 7 * 864e5; }
  return n;
}

function b64ToU8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function enablePush() {
  if (isIOS() && !isStandalone()) {
    modal(`<h2>📲 One quick step on iPhone</h2>
      <p class="muted">Apple only allows notifications for apps on your Home Screen.</p>
      <ol class="mt" style="padding-left:20px;line-height:1.9">
        <li>Tap the <b>Share</b> button <span class="pill">⬆️</span> in Safari</li>
        <li>Tap <b>Add to Home Screen</b></li>

        <li>Come back here and tap <b>Turn on notifications</b></li>
      </ol>
      <button class="btn primary full mt" onclick="closeModal()">Got it</button>`);
    return;
  }
  if (!('Notification' in window) || !('serviceWorker' in navigator)) { toast('This browser can’t do notifications', 'Try Chrome, Edge, Firefox or Safari (iOS 16.4+).', 'loss'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications blocked', 'Allow them in your browser/site settings, then try again.', 'loss'); return; }
  try {
    const reg = S.swReg || await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await q(sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, user_id: S.me.id, p256dh: j.keys.p256dh, auth: j.keys.auth }));
    S.pushOn = true;
    toast('Notifications ON 🔔', 'You’ll get pinged even when the app is closed.', 'pr');
    boom(.5);
    await sb.rpc('test_push');
    render();
  } catch (e) { toast('Couldn’t turn on push', e.message, 'loss'); }
}
async function disablePush() {

}

function nextDay(split, workouts) {
  if (!split?.days?.length) return null;
  const last = workouts.find(w => w.split_id === split.id);
  if (!last) return 0;
  const i = split.days.findIndex(d => d.name === last.day_name);
  return (i + 1) % split.days.length;
}

A.plates = () => {
  let side = ((+$('#plateIn').value || 0) - 20) / 2;
  if (side < 0) return $('#plateOut').innerHTML = '<span class="muted">That’s less than the empty bar (20kg).</span>';
  const out = [];
  for (const p of [25, 20, 15, 10, 5, 2.5, 1.25]) while (side >= p - 1e-9) { out.push(p); side -= p; }
  $('#plateOut').innerHTML = `<b>Each side:</b> ${out.length ? out.map(p => `<span class="pill lime">${p}</span>`).join(' ') : 'nothing — just the bar'}${side > .01 ? `<div class="tiny muted mt">(${side.toFixed(2)}kg left over — can’t be made with standard plates)</div>` : ''}`;
};
A.orm = () => {
  const v = e1rm(+$('#ormW').value || 0, +$('#ormR').value || 0);
  $('#ormOut').innerHTML = v ? `Estimated 1RM: <b class="lime" style="font-size:20px">${kg(v)}</b>` : '<span class="muted">Enter weight and reps.</span>';
};

function mkExercise(name, sets = 3, reps = '') {
  const last = lastFor(name);
  const ls = last?.sets || [];
  return {
    name, target: String(reps || ''), last: last ? { sets: ls.map(s => [+s.weight, +s.reps]), best: last.best } : null,
    sets: Array.from({ length: +sets || 3 }, (_, i) => ({ w: ls[i]?.weight ?? ls[ls.length - 1]?.weight ?? '', r: '', done: false })),
  };
}
function saveActive() { lsSet('lb_active', S.active); }

  if (S.active && !await confirmBox('Replace current workout?', 'You have a workout in progress. Starting a new one throws it away.', 'Start new')) return;
  await ensureMyLifts(true);
  const split = S.splits.find(s => s.id === el.dataset.split), day = split.days[+el.dataset.day];
  S.active = { split_id: split.id, day_name: day.name, started: Date.now(), notes: '', exercises: day.exercises.map(e => mkExercise(e.name, e.sets, e.reps)) };
  saveActive(); location.hash = '#/log';
};

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.set && S.active) {
    const [i, j, k] = t.dataset.set.split('.');
    S.active.exercises[+i].sets[+j][k] = t.value; saveActive();
  } else if (t.dataset.bind && S.active) { S.active[t.dataset.bind] = t.value; saveActive(); }
  else if (t.dataset.dbind && S.draft) { setPath(S.draft, t.dataset.dbind, t.value); }
});
function tickElapsed() {
  const el = $('#elapsed'); if (!el || !S.active) return;
  const s = Math.floor((Date.now() - S.active.started) / 1000);
  el.textContent = `${Math.floor(s / 3600) ? Math.floor(s / 3600) + ':' : ''}${String(Math.floor(s / 60) % 60).padStart(Math.floor(s / 3600) ? 2 : 1, '0')}:${String(s % 60).padStart(2, '0')}`;
}
setInterval(tickElapsed, 1000);
function rerenderEx(i) { const card = $(`[data-ex="${i}"]`); if (card) card.outerHTML = exCard(S.active.exercises[i], i); }
A.tick = el => {
  const i = +el.dataset.i, j = +el.dataset.j, s = S.active.exercises[i].sets[j], ex = S.active.exercises[i];
  if (!s.done) {
    if (s.r === '' || s.r == null) s.r = parseInt(ex.target) || ex.last?.sets[j]?.[1] || '';
    if (s.r === '') { toast('How many reps?', 'Type the reps you did first.', 'loss'); $(`[data-set="${i}.${j}.r"]`)?.focus(); return; }
    s.done = true; buzz([30]); startRest(prefs.rest);
  } else s.done = false;
  saveActive(); rerenderEx(i);
};

A.finish = async el => {
  const a = S.active;
  const rows = [];
  a.exercises.forEach(ex => ex.sets.forEach((s, j) => {
    const r = parseInt(s.r) || 0, w = parseFloat(s.w) || 0;
    if (r > 0 || s.done) rows.push({ exercise: ex.name.trim(), set_no: j + 1, weight: w, reps: r, target_reps: parseInt(ex.target) || null, completed: !!s.done && r > 0 });
  }));
  if (!rows.some(r => r.completed)) return toast('Tick at least one set ✓', 'Mark the sets you completed before finishing.', 'loss');
  el.disabled = true; el.textContent = 'Crunching your numbers…';
  let wid = null;
  try {
    const w = await q(sb.from('workouts').insert({ user_id: S.me.id, split_id: a.split_id, day_name: a.day_name.trim() || 'Workout', notes: a.notes || '',
      duration_min: Math.round((Date.now() - a.started) / 60000), performed_on: localDate() }).select().single());
    wid = w.id;
    await q(sb.from('lifts').insert(rows.map(r => ({ ...r, workout_id: wid, user_id: S.me.id }))));
    const res = await q(sb.rpc('finish_workout', { p_workout: wid }));
    S.active = null; saveActive(); stopRest(); S.myLifts = null; S.myWorkouts = null;
    location.hash = '#/workout/' + wid;
    showResults(res);
  } catch (e) {
    if (wid) await sb.from('workouts').delete().eq('id', wid);
    toast('Couldn’t save workout', e.message, 'loss');
    el.disabled = false; el.textContent = '🏁 Finish workout';
  }
};

let restT = null;
function startRest(sec) {

  const slot = $('#restSlot');
  const paint = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));

    if (left <= 0) {
      stopRest(); sound('rest'); buzz([200, 100, 200, 100, 400]); toast('Rest over — next set! 💪', '', 'pr', null, 2500);

function lrow(r, rank, i) {
  const me = r.user_id === S.me.id;

function fame(rows) {
  if (!rows.length) return '';
  const by = (f, dir = -1, filt = () => true) => rows.filter(filt).slice().sort((a, b) => dir * ((f(a) ?? -1e9) - (f(b) ?? -1e9)))[0];
  const card = (ttl, r, val, cls = '') => r ? `<a href="#/user/${r.user_id}" class="card ${cls}"><div class="ttl">${ttl}</div><div class="who">${avatar(r, 'sm')}${esc(r.username)}</div><div class="val">${val}</div></a>` : '';
  const gains = by(r => r.gain_pct, -1, r => r.gain_pct != null);
  const prs = by(r => r.prs, -1, r => r.prs > 0);
  const days = by(r => r.days, -1, r => r.days > 0);
  const vol = by(r => +r.volume, -1, r => r.volume > 0);
  const least = rows.slice().sort((a, b) => a.days - b.days || (new Date(a.last_workout || 0) - new Date(b.last_workout || 0)))[0];
  const drops = by(r => r.drops, -1, r => r.drops > 0);
  const worst = by(r => r.gain_pct, 1, r => r.gain_pct != null);
  const ghost = rows.slice().sort((a, b) => new Date(a.last_workout || 0) - new Date(b.last_workout || 0))[0];
  return `<div class="fame">
    ${card('👑 Most gains', gains, pct(gains?.gain_pct), 'hl')}
    ${card('🔥 Most PRs', prs, (prs?.prs || 0) + ' PRs', 'hl')}
    ${card('📅 Most days', days, (days?.days || 0) + ' days', 'hl')}
    ${card('🏗️ Hardest worker', vol, kg(vol?.volume), 'hl')}
    ${card('🛋️ Least days', least, least?.days + ' days', 'warn')}
    ${card('📉 Went backwards', drops, (drops?.drops || 0) + (drops?.drops === 1 ? ' drop' : ' drops'), 'warn')}
    ${worst && worst.user_id !== gains?.user_id ? card('🐢 Smallest gains', worst, pct(worst.gain_pct), 'warn') : ''}
    ${card('👻 Ghost', ghost, ghost?.last_workout ? daysSince(ghost.last_workout) + ' days since last' : 'never trained', 'warn')}
  </div>`;
}

function drawChart(lifts, ex) {
  const svg = $('#chart'); if (!svg) return;
  const byDay = {};
  lifts.filter(l => l.exercise.trim().toLowerCase() === ex.toLowerCase()).forEach(l => {
    const d = l.created_at.slice(0, 10); byDay[d] = Math.max(byDay[d] || 0, +l.e1rm);
  });
  const pts = Object.entries(byDay).sort();
  const W = svg.clientWidth || 320, H = 170, P = 26;
  if (pts.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" fill="#8b95a3" text-anchor="middle" font-size="13">Log ${esc(ex)} again to see a trend</text>`; return; }
  const vals = pts.map(p => p[1]), mn = Math.min(...vals) * .95, mx = Math.max(...vals) * 1.05;
  const x = i => P + i * (W - P * 2) / (pts.length - 1), y = v => H - P - (v - mn) / (mx - mn || 1) * (H - P * 2);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c6ff3d" stop-opacity=".35"/><stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L${x(pts.length - 1)},${H - P} L${x(0)},${H - P}Z" fill="url(#cg)"/>
    <path d="${path}" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.4s ease forwards"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="4" fill="#0b0d10" stroke="#c6ff3d" stroke-width="2"/>`).join('')}
    <text x="${P}" y="14" fill="#8b95a3" font-size="11">${Math.round(vals[0])}kg</text><text x="${W - P}" y="14" fill="#c6ff3d" font-size="11" text-anchor="end" font-weight="700">${Math.round(vals[vals.length - 1])}kg</text>
    <style>@keyframes draw{to{stroke-dashoffset:0}}</style>`;
}
A.badgeInfo = el => {
  const b = BADGES[el.dataset.k], got = el.dataset.earned;
  modal(`<div class="center"><div class="bigbadge" style="${got ? '' : 'filter:grayscale(1) opacity(.4)'}">${b[0]}</div><h2 class="mt">${esc(b[1])}</h2>
    <p class="muted">${esc(b[2])}</p><p class="mt ${got ? 'lime' : 'dim'}">${got ? 'Unlocked ' + ago(got) + ' 🎉' : 'Locked — go earn it!'}</p>
    <button class="btn primary full mt2" onclick="closeModal()">Nice</button></div>`);
};
A.addGoal = async () => {
  const ex = $('#gEx').value.trim(), w = parseFloat($('#gKg').value);
  if (!ex || !(w > 0)) return toast('Enter an exercise and a target weight', '', 'loss');
  await q(sb.from('goals').insert({ user_id: S.me.id, exercise: ex, target_weight: w }));
  toast('Goal set 🎯', `${ex} ${kg(w)} — go get it.`, 'goal'); render();
};
A.delGoal = async el => { await q(sb.from('goals').delete().eq('id', el.dataset.id)); render(); };
A.editProfile = () => {
  const p = S.me; let av = p.avatar;
  const m = modal(`<h2>Edit profile</h2>
    <label class="f">Avatar</label><div class="avatars">${AVATARS.map(a => `<button type="button" class="${a === av ? 'on' : ''}" data-a="${a}">${a}</button>`).join('')}</div>
    <label class="f">Bio</label><textarea class="inp" id="pBio" maxlength="160" placeholder="Bench PR chaser. Leg day skipper.">${esc(p.bio || '')}</textarea>
    <label class="f">Bodyweight (kg, optional — only shown to you)</label><input class="inp" id="pBw" type="number" inputmode="decimal" value="${esc(p.bodyweight ?? '')}">
    <div class="mt2">${btn('Save profile', 'saveProfile', 'Updates what everyone sees on your profile.', 'primary full')}</div>`);
  $$('.avatars button', m).forEach(b => b.onclick = () => { av = b.dataset.a; m.dataset.av = av; $$('.avatars button', m).forEach(x => x.classList.toggle('on', x === b)); });
  m.dataset.av = av;
};
A.saveProfile = async () => {
  const m = $('#modal .modal');
  const upd = { avatar: m.dataset.av, bio: $('#pBio').value.trim(), bodyweight: parseFloat($('#pBw').value) || null };
  await q(sb.from('profiles').update(upd).eq('id', S.me.id));
  Object.assign(S.me, upd); closeModal(); toast('Profile saved', '', 'pr'); render();
};

/* ================== GYMS ================== */
async function viewGyms() {
  await Promise.all([loadGyms(), loadProfiles()]);
  const members = id => Object.values(S.profiles).filter(p => p.gym_id === id);
  return `<a href="#/profile" class="small muted">← Profile</a><h1 class="mt">Gyms</h1>
    <p class="help mt">Make a crew for your actual gym (or your group chat). Members get their own “My gym” leaderboard. You can be in one gym at a time.</p>
    ${S.gyms.map(g => { const ms = members(g.id), mine = S.me.gym_id === g.id;
      return `<div class="card ${mine ? 'hl' : ''}"><div class="row"><div class="av">${esc(g.emoji)}</div><div class="grow"><h3>${esc(g.name)}</h3><div class="tiny muted">${esc(g.location || '')}${g.location ? ' · ' : ''}${ms.length} member${ms.length === 1 ? '' : 's'}</div></div>${mine ? '<span class="pill lime">YOUR GYM</span>' : ''}</div>
        ${g.description ? `<p class="small muted mt">${esc(g.description)}</p>` : ''}
        <div class="row wrap mt">${ms.slice(0, 12).map(p => `<a href="#/user/${p.id}" title="${esc(p.username)}">${avatar(p, 'sm')}</a>`).join('')}</div>
        <div class="mt">${mine ? btn('Leave gym', 'joinGym', 'Removes you from this crew.', 'sm danger', 'data-id=""') : btn('Join gym', 'joinGym', 'Join this crew and compete on its leaderboard.', 'primary sm', `data-id="${g.id}"`)}</div></div>`; }).join('') || '<div class="empty"><span class="e">🏗️</span>No gyms yet. Make the first one!</div>'}
    <div class="card"><h3>Create a gym</h3>
      <div class="row mt"><input class="inp" id="gEmoji" value="🏋️" maxlength="4" style="max-width:64px;text-align:center"><input class="inp" id="gName" placeholder="Gym name" maxlength="40"></div>
      <input class="inp mt" id="gLoc" placeholder="Location (optional)"><input class="inp mt" id="gDesc" placeholder="Description (optional)">
      <div class="mt">${btn('Create & join', 'createGym', 'Creates the gym and puts you in it.', 'primary full')}</div></div>`;
}
A.joinGym = async el => {
  const id = el.dataset.id || null;
  await q(sb.from('profiles').update({ gym_id: id }).eq('id', S.me.id));
  S.me.gym_id = id; toast(id ? 'Joined gym 🏠' : 'Left gym', '', id ? 'pr' : ''); render();
};
A.createGym = async () => {
  const name = $('#gName').value.trim(); if (name.length < 2) return toast('Give your gym a name', '', 'loss');
  const g = await q(sb.from('gyms').insert({ name, emoji: $('#gEmoji').value.trim() || '🏋️', location: $('#gLoc').value.trim(), description: $('#gDesc').value.trim(), owner_id: S.me.id }).select().single());
  await q(sb.from('profiles').update({ gym_id: g.id }).eq('id', S.me.id));
  S.me.gym_id = g.id; boom(.5); toast('Gym created!', 'Invite your mates.', 'pr'); render();
};

/* ================== SETTINGS ================== */
async function viewSettings() {
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  return `<a href="#/profile" class="small muted">← Profile</a><h1 class="mt">Settings</h1>
    <div class="card"><h3>🔔 Notifications</h3>
      <p class="small muted mt">Status: <b class="${S.pushOn ? 'lime' : 'red'}">${S.pushOn ? 'Push ON' : perm === 'denied' ? 'Blocked in browser settings' : 'Off'}</b></p>
      <p class="tiny muted mt">You’ll be told when: someone PRs, takes #1, goes backwards, is dead last, smashes a goal, hasn’t trained in a week, messages, comments, reacts or nudges you — plus weekly results every Monday.</p>
      <div class="row mt" style="align-items:flex-start">${S.pushOn ? btn('Send test', 'testPush', 'Sends a test notification to this device.', 'sm grow') + btn('Turn off', 'pushOff', 'Stops push on this device.', 'sm danger grow')
        : btn('Turn on notifications', 'enablePush', 'Allow alerts even when the app is closed.', 'primary grow')}</div></div>
    <div class="card"><h3>📲 Install the app</h3><p class="small muted mt">${isIOS() ? 'In Safari tap Share ⬆️ → Add to Home Screen. Needed for notifications on iPhone.' : 'In Chrome tap ⋮ → Install app / Add to Home screen. It’ll open full-screen like a real app.'}</p></div>
    <div class="card"><h3>Preferences</h3>
      ${toggleRow('Show button tips', 'tips', 'The little grey explanations under buttons.')}
      ${toggleRow('Sounds', 'sound', 'Fanfare for PRs, sad trombone for losses.')}
      <label class="f">Rest timer after each set</label>
      <div class="seg">${[60, 90, 120, 180].map(s => `<button class="${prefs.rest === s ? 'on' : ''}" data-act="setRest" data-s="${s}">${s < 120 ? s + 's' : s / 60 + 'm'}</button>`).join('')}</div>
      <div class="tip mt">Starts automatically when you tick a set.</div></div>
    <div class="card"><h3>Account</h3><p class="small muted mt">Logged in as <b>${esc(S.me.username)}</b>. Keep your password safe — there’s no email reset.</p>
      <div class="mt">${btn('Log out', 'logout', 'Signs you out on this device.', 'danger full')}</div></div>`;
}
function toggleRow(label, key, tip) {
  return `<div class="row between mt"><div><b class="small">${label}</b><div class="tip">${tip}</div></div><button class="btn sm ${prefs[key] ? 'primary' : ''}" data-act="togglePref" data-k="${key}">${prefs[key] ? 'ON' : 'OFF'}</button></div>`;
}
A.togglePref = el => { prefs[el.dataset.k] = !prefs[el.dataset.k]; lsSet('lb_prefs', prefs); render(); };
A.setRest = el => { prefs.rest = +el.dataset.s; lsSet('lb_prefs', prefs); render(); };
A.pushOff = async () => { await disablePush(); toast('Push turned off'); render(); };

/* ================== BOOT ================== */
async function boot(session) {
  S.session = session;
  if (!session) { S.me = null; if (S.channel) { sb.removeChannel(S.channel); S.channel = null; } render(); return; }
  try {
    await Promise.all([loadProfiles(), loadSplits(), loadGyms()]);
    if (!S.me) { await new Promise(r => setTimeout(r, 800)); await loadProfiles(); }
    if (!S.me) throw new Error('Profile not found');
    subscribeRealtime();
    registerSW().then(() => { if (location.hash === '#/' || !location.hash) render(); });
    refreshCounts();
    sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', S.me.id).then(() => {});
  } catch (e) { toast('Couldn’t load your account', e.message, 'loss'); }
  render();
}
let booted = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
    if (event === 'SIGNED_IN' && booted && S.session?.user.id === session?.user.id) return;
    booted = true; setTimeout(() => boot(session), 0);
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refreshCounts(); });
</script>
</body>
